name: Test SSH Connection

on:
  workflow_dispatch:

jobs:
  test-ssh:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          : "${SSH_PRIVATE_KEY:?SSH_PRIVATE_KEY is not configured}"
          : "${SSH_HOST:?SSH_HOST is not configured}"
          : "${SSH_PORT:?SSH_PORT is not configured}"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null
          ssh-keyscan -T 10 -p "$SSH_PORT" -H "$SSH_HOST" 2>/dev/null > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts

      - name: Test SSH Connection
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?SSH_HOST is not configured}"
          : "${SSH_PORT:?SSH_PORT is not configured}"
          : "${SSH_USER:?SSH_USER is not configured}"
          trap 'rm -f ~/.ssh/id_rsa' EXIT
          ssh \
              -i ~/.ssh/id_rsa \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o LogLevel=ERROR \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -p "$SSH_PORT" \
              "$SSH_USER@$SSH_HOST" \
              "echo 'SSH connection successful'"
      - name: Check mixhost Directory
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_rsa \
              -o BatchMode=yes \
              -p "$SSH_PORT" \
              "$SSH_USER@$SSH_HOST" \
              "echo 'HOME DIRECTORY:'; pwd; echo 'WEB DIRECTORY:'; ls -ld ~/public_html/apps.treev.work"
